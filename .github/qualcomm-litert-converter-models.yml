# Model configurations for qualcomm-litert-converter.yml
# Each entry describes one model to convert via qairt-converter.
#
# Fields:
#   name                    - unique model identifier (also used as the DLC subdirectory name)
#   model_path              - path to the source model file, relative to vars.MODEL_ZOO_ROOT
#   input_path              - directory of input tensors, relative to vars.MODEL_ZOO_ROOT
#   qairt_converter_params  - list of extra CLI flags passed verbatim to qairt-converter
#   litert_converter_params - list of extra CLI flags passed verbatim to apply_plugin_main
#   net_run_params          - (optional) overrides for net_run.py profiling
#     num_inferences              - number of inferences to run (default: 50)
#     profiling_level             - basic | detailed | client (default: client)
#     use_native_input_files      - pass --use_native_input_files to qnn-net-run (default: true)
#                                   set to false for quantized models with float32 input files
#
# Absolute paths are resolved at runtime as: <vars.MODEL_ZOO_ROOT>/<model_path|input_path>

models:
  # ── public_tflite ─────────────────────────────────────────────────────────
  - name: tflite-cnns_inception_v3
    model_path: public_tflite/tflite-cnns_inception_v3/Source_model/model.tflite
    input_path: public_tflite/tflite-cnns_inception_v3/inputs/
    qairt_converter_params: []
    litert_converter_params:
      - [--soc_model, SM8850]
    net_run_params:
      num_inferences: 50
      profiling_level: client

  - name: tflite-cnns_inception_v3_quant
    model_path: public_tflite/tflite-cnns_inception_v3_quant/Source_model/model.tflite
    input_path: public_tflite/tflite-cnns_inception_v3_quant/inputs/
    qairt_converter_params:
      - [--source_model_input_datatype, input, uint8]
    litert_converter_params:
      - [--soc_model, SM8850]
      - [--qualcomm_source_model_input_datatype, input, uint8]
    net_run_params:
      num_inferences: 50
      profiling_level: client
      use_native_input_files: false

  - name: tflite-cnns_inception_v4
