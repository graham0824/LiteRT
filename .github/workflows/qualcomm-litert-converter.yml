name: "qualcomm-litert-converter"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ASTROBOT_SHA: dev/hungjuiw/astro-for-ci

jobs:
  converter:
    name: "Qualcomm-LiteRT-Converter"
    runs-on: ["self-hosted", "X64", "Linux"]
    container:
      image: artifactory-edge-qdc.qualcomm.com/aisw-mlg-docker-virtual/public/mlg-develop/jammy:latest
      options: --privileged --ulimit core=-1
      volumes:
        - /opt/litert_ci_cache:/litert_ci_cache
        - ${{ vars.MODEL_ZOO_ROOT }}:/model_zoo_root
    steps:
      - name: Checkout LiteRT repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup LiteRT CI
        id: setup
        uses: ./.github/actions/qualcomm-setup-litert
        with:
          astrobot_deploy_key: ${{ secrets.ASTROBOT_DEPLOY_KEY }}
          astrobot_sha: ${{ env.ASTROBOT_SHA }}

      - name: Install Python dependencies
        shell: bash
        run: pip3 install --quiet pyyaml tflite==2.18.0 matplotlib openpyxl

      - name: Run qairt-converter for each model
        shell: bash
        run: |
          source /qairt/${{ steps.setup.outputs.qairt_version }}/bin/envsetup.sh
          python3 - <<'PYEOF'
          import subprocess, sys, yaml, os, pathlib

          converter     = "qairt-converter"
          models_config = os.environ["MODELS_CONFIG"]
          dlc_root      = os.environ["DLC_OUTPUT_ROOT"]
          model_zoo_root = os.environ["MODEL_ZOO_ROOT"]

          with open(models_config) as f:
              config = yaml.safe_load(f)

          failures = []

          for entry in config["models"]:
              name         = entry["name"]
              model_input  = os.path.join(model_zoo_root, entry["model_path"])
              dlc_dir      = os.path.join(dlc_root, name)
              pathlib.Path(dlc_dir).mkdir(parents=True, exist_ok=True)
              dlc_output   = os.path.join(dlc_dir, f"{name}.dlc")
              extra_params = []
              for p in entry.get("qairt_converter_params", []):
                  extra_params.extend(p if isinstance(p, list) else [p])

              cmd = [converter, "-i", model_input, "-o", dlc_output] + extra_params
              print(f"[convert] {name}: {' '.join(cmd)}", flush=True)
              result = subprocess.run(cmd, capture_output=False,
                                      cwd=os.path.dirname(model_input))
              if result.returncode != 0:
                  print(f"[ERROR] qairt-converter failed for {name} (exit {result.returncode})", flush=True)
                  failures.append(name)

          if failures:
              print(f"\n[SUMMARY] qairt-converter failed for: {failures}", flush=True)
              sys.exit(1)

          PYEOF
        env:
          MODELS_CONFIG: ${{ github.workspace }}/.github/qualcomm-litert-converter-models.yml
          DLC_OUTPUT_ROOT: ${{ github.workspace }}/dlc_output
          MODEL_ZOO_ROOT: /model_zoo_root

      - name: Run litert-converter for each model
        if: always()
        shell: bash
        run: |
          LITERT_QAIRT_SDK=/qairt/${{ steps.setup.outputs.qairt_version }} \
            bazel build //litert/tools:apply_plugin_main
          python3 - <<'PYEOF'
          import subprocess, sys, yaml, os, pathlib

          models_config  = os.environ["MODELS_CONFIG"]
          dlc_root       = os.environ["DLC_OUTPUT_ROOT"]
          model_zoo_root = os.environ["MODEL_ZOO_ROOT"]
          workspace      = os.environ["GITHUB_WORKSPACE"]

          apply_plugin = os.path.join(workspace, "bazel-bin/litert/tools/apply_plugin_main")
          compiler_libs = os.path.join(workspace, "bazel-bin/litert/vendors/qualcomm/compiler")

          with open(models_config) as f:
              config = yaml.safe_load(f)

          failures = []

          for entry in config["models"]:
              name        = entry["name"]
              model_input = os.path.join(model_zoo_root, entry["model_path"])
              dlc_dir     = os.path.join(dlc_root, name)
              pathlib.Path(dlc_dir).mkdir(parents=True, exist_ok=True)
              dummy_out   = os.path.join(dlc_dir, "dummy.tflite")
              extra_params = []
              for p in entry.get("litert_converter_params", []):
                  extra_params.extend(p if isinstance(p, list) else [p])

              cmd = [
                  apply_plugin,
                  "--cmd",    "compile",
                  "--libs",   compiler_libs,
                  "--model",  model_input,
                  "--qualcomm_dlc_dir", dlc_dir,
                  "--soc_manufacturer", "Qualcomm",
                  "-o",       dummy_out,
              ] + extra_params
              print(f"[litert-convert] {name}: {' '.join(cmd)}", flush=True)
              env = os.environ.copy()
              qairt_sdk = os.environ["QAIRT_SDK"]
              qairt_lib = os.path.join(qairt_sdk, "lib", "x86_64-linux-clang")
              env["LD_LIBRARY_PATH"] = qairt_lib + ":" + env.get("LD_LIBRARY_PATH", "")
              result = subprocess.run(cmd, capture_output=False, env=env,
                                      cwd=os.path.dirname(model_input))
              if result.returncode != 0:
                  print(f"[ERROR] apply_plugin_main failed for {name} (exit {result.returncode})", flush=True)
                  failures.append(name)

          if failures:
              print(f"\n[SUMMARY] litert-converter failed for: {failures}", flush=True)
              sys.exit(1)

          PYEOF
        env:
          QAIRT_SDK: /qairt/${{ steps.setup.outputs.qairt_version }}
          MODELS_CONFIG: ${{ github.workspace }}/.github/qualcomm-litert-converter-models.yml
          DLC_OUTPUT_ROOT: ${{ github.workspace }}/dlc_output
          MODEL_ZOO_ROOT: /model_zoo_root

      - name: Write devices.json
        if: always()
        env:
          DEVICES_JSON: ${{ vars.DEVICES_JSON }}
        run: echo "$DEVICES_JSON" > /astrobot/LiteRT/test_scripts/devices.json

      - name: Profile DLC with net_run.py for each model
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys, yaml, os, pathlib

          qairt_sdk     = os.environ["QAIRT_SDK"]
          models_config = os.environ["MODELS_CONFIG"]
          dlc_root      = os.environ["DLC_OUTPUT_ROOT"]
          prof_root     = os.environ["PROFILING_OUTPUT_ROOT"]

          with open(models_config) as f:
              config = yaml.safe_load(f)

          results = {}  # name -> {"qairt": time_str, "litert": time_str, "litert_display": str}
          failures = []

          def parse_inference_time(output):
              in_section = False
              for line in output.splitlines():
                  if "Total Inference Time" in line:
                      in_section = True
                      continue
                  if in_section and "NetRun:" in line:
                      return line.strip()
              return "N/A"

          def extract_us(time_str):
              import re
              m = re.search(r"NetRun:\s*([\d,]+)\s*us", time_str)
              if m:
                  return int(m.group(1).replace(",", ""))
              return None

          for entry in config["models"]:
              name      = entry["name"]
              dlc_dir   = os.path.join(dlc_root, name)
              inputs_pth = os.path.join(os.environ["MODEL_ZOO_ROOT"], entry["input_path"])

              net_run = entry.get("net_run_params", {})
              num_inferences          = net_run.get("num_inferences", 50)
              profiling_level         = net_run.get("profiling_level", "client")
              use_native_input_files  = net_run.get("use_native_input_files", True)

              def run_net_run(label, dlc_pth):
                  output_pth = os.path.join(prof_root, name, label)
                  pathlib.Path(output_pth).mkdir(parents=True, exist_ok=True)
                  cmd = [
                      "python3", "/astrobot/QNNTools/net_run.py",
                      "--model_pth",       dlc_pth,
                      "--inputs_pth",      inputs_pth,
                      "--output_pth",      output_pth,
                      "--qnn_sdk_root",    qairt_sdk,
                      "--num_inferences",  str(num_inferences),
                      "--profiling_level", profiling_level,
                  ]
                  if not use_native_input_files:
                      cmd += ["--no-use_native_input_files"]
                  print(f"[profile/{label}] {name}: {' '.join(cmd)}", flush=True)
                  result = subprocess.run(cmd, capture_output=True, text=True)
                  print(result.stdout, flush=True)
                  if result.stderr:
                      print(result.stderr, flush=True)
                  if result.returncode != 0:
                      print(f"[ERROR] net_run.py failed for {name}/{label} (exit {result.returncode})", flush=True)
                      failures.append(f"{name}/{label}")
                      return "FAILED"
                  return parse_inference_time(result.stdout)

              # Profile qairt-converter DLC
              qairt_dlc = os.path.join(dlc_dir, f"{name}.dlc")
              if not pathlib.Path(qairt_dlc).exists():
                  print(f"[SKIP] qairt DLC not found for {name}, skipping profiling", flush=True)
                  results[name] = {"qairt": "SKIP", "litert": "SKIP"}
                  continue
              qairt_time = run_net_run("qairt", qairt_dlc)

              # Profile LiteRT DLC (assert exactly one partition)
              litert_dlcs = sorted(pathlib.Path(dlc_dir).glob("qnn_partition_*.dlc"))
              if not litert_dlcs:
                  print(f"[ERROR] No qnn_partition_*.dlc found in {dlc_dir}", flush=True)
                  failures.append(f"{name}/litert-missing-dlc")
                  results[name] = {"qairt": qairt_time, "litert": "FAILED"}
                  continue
              if len(litert_dlcs) > 1:
                  print(f"[ERROR] Multiple LiteRT DLC partitions found in {dlc_dir}: {[str(p) for p in litert_dlcs]}", flush=True)
                  failures.append(f"{name}/litert-multiple-partitions")
                  results[name] = {"qairt": qairt_time, "litert": "FAILED"}
                  continue
              litert_time = run_net_run("litert", str(litert_dlcs[0]))

              qairt_us  = extract_us(qairt_time)
              litert_us = extract_us(litert_time)
              if qairt_us and litert_us:
                  diff = (litert_us - qairt_us) / qairt_us * 100
                  sign = "+" if diff >= 0 else ""
                  litert_display = f"{litert_time} ({sign}{diff:.1f}%)"
              else:
                  litert_display = litert_time

              results[name] = {"qairt": qairt_time, "litert": litert_display}

          # Print comparison table
          name_col = max(len(n) for n in results) + 2
          val_col  = 40
          total    = name_col + val_col * 2
          print("\n" + "=" * total, flush=True)
          print(f"{'Model':<{name_col}} {'qairt-converter':<{val_col}} {'LiteRT':<{val_col}}", flush=True)
          print("-" * total, flush=True)
          for name, times in results.items():
              print(f"{name:<{name_col}} {times['qairt']:<{val_col}} {times['litert']:<{val_col}}", flush=True)
          print("=" * total, flush=True)

          # Write results JSON for downstream report step
          import json
          report_dir = os.environ["REPORT_OUTPUT_ROOT"]
          pathlib.Path(report_dir).mkdir(parents=True, exist_ok=True)
          with open(os.path.join(report_dir, "profiling_results.json"), "w") as f:
              json.dump(results, f, indent=2)

          if failures:
              print(f"\n[SUMMARY] Profiling failed for: {failures}", flush=True)
              sys.exit(1)

          PYEOF
        env:
          QAIRT_SDK: /qairt/${{ steps.setup.outputs.qairt_version }}
          MODELS_CONFIG: ${{ github.workspace }}/.github/qualcomm-litert-converter-models.yml
          DLC_OUTPUT_ROOT: ${{ github.workspace }}/dlc_output
          PROFILING_OUTPUT_ROOT: ${{ github.workspace }}/profiling_output
          REPORT_OUTPUT_ROOT: ${{ github.workspace }}/report_output
          MODEL_ZOO_ROOT: /model_zoo_root

      - name: Generate report artifacts (bar chart + xlsx)
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, re, yaml

          report_dir    = os.environ["REPORT_OUTPUT_ROOT"]
          models_config = os.environ["MODELS_CONFIG"]
          model_zoo_root = os.environ["MODEL_ZOO_ROOT"]
          workspace     = os.environ["GITHUB_WORKSPACE"]
          dlc_root      = os.environ["DLC_OUTPUT_ROOT"]
          qairt_sdk     = os.environ["QAIRT_SDK"]

          results_path = os.path.join(report_dir, "profiling_results.json")
          if not pathlib.Path(results_path).exists():
              print("[SKIP] profiling_results.json not found, skipping report generation", flush=True)
              exit(0)

          with open(results_path) as f:
              results = json.load(f)

          with open(models_config) as f:
              config = yaml.safe_load(f)

          apply_plugin  = os.path.join(workspace, "bazel-bin/litert/tools/apply_plugin_main")
          compiler_libs = os.path.join(workspace, "bazel-bin/litert/vendors/qualcomm/compiler")

          def extract_us(time_str):
              m = re.search(r"NetRun:\s*([\d,]+)\s*us", time_str or "")
              if m:
                  return int(m.group(1).replace(",", ""))
              return None

          def extract_pct(litert_display):
              m = re.search(r"\(([+-]?[\d.]+)%\)", litert_display or "")
              if m:
                  return float(m.group(1))
              return None

          # --- Bar chart ---
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt

          names, diffs = [], []
          for name, times in results.items():
              pct = extract_pct(times.get("litert", ""))
              if pct is not None:
                  names.append(name)
                  diffs.append(pct)

          if names:
              names, diffs = zip(*sorted(zip(names, diffs), key=lambda x: x[1]))
              names, diffs = list(names), list(diffs)
              colors = ["#d62728" if d > 0 else "#2ca02c" for d in diffs]
              fig, ax = plt.subplots(figsize=(10, max(6, len(names) * 0.3)))
              bars = ax.barh(names, diffs, color=colors)
              ax.axvline(0, color="black", linewidth=0.8)
              ax.set_ylabel("Model")
              ax.set_xlabel("LiteRT vs qairt-converter diff (%)")
              ax.set_title("Inference time delta: LiteRT / qairt-converter")
              for bar, val in zip(bars, diffs):
                  sign = "+" if val >= 0 else ""
                  ax.text(val, bar.get_y() + bar.get_height() / 2,
                          f" {sign}{val:.1f}%", ha="left" if val >= 0 else "right",
                          va="center", fontsize=8)
              fig.tight_layout()
              chart_path = os.path.join(report_dir, "inference_diff.png")
              fig.savefig(chart_path, dpi=150)
              print(f"[report] Bar chart saved to {chart_path}", flush=True)
          else:
              print("[report] No numeric diff data available, skipping bar chart", flush=True)

          # --- xlsx ---
          import openpyxl
          from openpyxl.styles import Font, PatternFill, Alignment

          wb = openpyxl.Workbook()
          ws = wb.active
          ws.title = "Converter Comparison"

          headers = [
              "Model",
              "qairt-converter command",
              "litert-converter command",
              "net-run command (qairt DLC)",
              "net-run command (litert DLC)",
              "qairt inference time",
              "litert inference time",
              "diff (%)",
          ]
          header_fill = PatternFill("solid", fgColor="4472C4")
          header_font = Font(bold=True, color="FFFFFF")
          for col, h in enumerate(headers, 1):
              cell = ws.cell(row=1, column=col, value=h)
              cell.fill = header_fill
              cell.font = header_font
              cell.alignment = Alignment(wrap_text=True)

          entry_map = {e["name"]: e for e in config["models"]}

          sorted_results = sorted(
              results.items(),
              key=lambda x: extract_pct(x[1].get("litert", "")) or float("inf"),
          )
          for row_idx, (name, times) in enumerate(sorted_results, 2):
              entry = entry_map.get(name, {})
              model_input = os.path.join(model_zoo_root, entry.get("model_path", ""))
              dlc_dir     = os.path.join(dlc_root, name)
              dlc_output  = os.path.join(dlc_dir, f"{name}.dlc")
              inputs_pth  = os.path.join(model_zoo_root, entry.get("input_path", ""))

              # qairt-converter command
              qairt_extra = []
              for p in entry.get("qairt_converter_params", []):
                  qairt_extra.extend(p if isinstance(p, list) else [p])
              qairt_cmd = " ".join(
                  ["qairt-converter", "-i", model_input, "-o", dlc_output] + qairt_extra
              )

              # litert-converter (apply_plugin_main) command
              litert_extra = []
              for p in entry.get("litert_converter_params", []):
                  litert_extra.extend(p if isinstance(p, list) else [p])
              dummy_out = os.path.join(dlc_dir, "dummy.tflite")
              litert_cmd = " ".join([
                  apply_plugin,
                  "--cmd", "compile",
                  "--libs", compiler_libs,
                  "--model", model_input,
                  "--qualcomm_dlc_dir", dlc_dir,
                  "--soc_manufacturer", "Qualcomm",
                  "-o", dummy_out,
              ] + litert_extra)

              # net_run command template
              net_run_params = entry.get("net_run_params", {})
              num_inf   = net_run_params.get("num_inferences", 50)
              prof_lvl  = net_run_params.get("profiling_level", "client")
              use_native = net_run_params.get("use_native_input_files", True)
              net_run_base = [
                  "python3", "/astrobot/QNNTools/net_run.py",
                  "--inputs_pth",      inputs_pth,
                  "--qnn_sdk_root",    qairt_sdk,
                  "--num_inferences",  str(num_inf),
                  "--profiling_level", prof_lvl,
              ]
              if not use_native:
                  net_run_base += ["--no-use_native_input_files"]
              qairt_net_run_cmd  = " ".join(net_run_base + ["--model_pth", dlc_output])
              litert_dlc_glob = sorted(pathlib.Path(dlc_dir).glob("qnn_partition_*.dlc"))
              litert_dlc_pth = str(litert_dlc_glob[0]) if litert_dlc_glob else f"{dlc_dir}/qnn_partition_0.dlc"
              litert_net_run_cmd = " ".join(net_run_base + ["--model_pth", litert_dlc_pth])

              qairt_time_str  = times.get("qairt", "")
              litert_time_str = times.get("litert", "")
              diff_pct        = extract_pct(litert_time_str)

              row = [
                  name,
                  qairt_cmd,
                  litert_cmd,
                  qairt_net_run_cmd,
                  litert_net_run_cmd,
                  qairt_time_str,
                  litert_time_str,
                  diff_pct,
              ]
              for col, val in enumerate(row, 1):
                  cell = ws.cell(row=row_idx, column=col, value=val)
                  cell.alignment = Alignment(wrap_text=True)
              # Colour diff cell: red if positive (LiteRT slower), green if negative
              diff_cell = ws.cell(row=row_idx, column=8)
              if diff_pct is not None:
                  fill_color = "FFCCCC" if diff_pct > 0 else "CCFFCC"
                  diff_cell.fill = PatternFill("solid", fgColor=fill_color)

          # Auto-fit column widths (cap at 80)
          for col in ws.columns:
              max_len = max((len(str(c.value or "")) for c in col), default=0)
              ws.column_dimensions[col[0].column_letter].width = min(max_len + 4, 80)

          xlsx_path = os.path.join(report_dir, "converter_comparison.xlsx")
          wb.save(xlsx_path)
          print(f"[report] xlsx saved to {xlsx_path}", flush=True)

          PYEOF
        env:
          QAIRT_SDK: /qairt/${{ steps.setup.outputs.qairt_version }}
          MODELS_CONFIG: ${{ github.workspace }}/.github/qualcomm-litert-converter-models.yml
          DLC_OUTPUT_ROOT: ${{ github.workspace }}/dlc_output
          REPORT_OUTPUT_ROOT: ${{ github.workspace }}/report_output
          MODEL_ZOO_ROOT: /model_zoo_root

      - name: Clean up profiling output
        if: always()
        run: rm -rf ${{ github.workspace }}/profiling_output

      - name: Clean up DLC output
        if: always()
        run: rm -rf ${{ github.workspace }}/dlc_output
